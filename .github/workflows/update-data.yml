name: Update daily problems data

on:
  schedule:
    # Poll hourly at :12 (off the top of the hour to dodge schedule delays and
    # drops). Runs are cheap when upstream is unchanged: the upstream check
    # below skips everything until Yawn-Sean/Daily_CF_Problems has a new commit.
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap poll: compare upstream HEAD with the SHA recorded at the last
      # full sync (data/.upstream-sha). Unchanged runs skip every step below
      # and finish in under a minute, so the schedule can poll often without
      # paying for Playwright, statement fetches or translations. Manual
      # workflow_dispatch always runs fully (also refreshes the marker).
      # If the upstream check itself fails, fall through to a full run.
      - name: Check upstream for updates
        id: upstream
        run: |
          UPSTREAM_SHA=$(git ls-remote https://github.com/Yawn-Sean/Daily_CF_Problems.git HEAD | cut -f1)
          LAST_SHA=$(cat data/.upstream-sha 2>/dev/null || true)
          if [ -n "$UPSTREAM_SHA" ] && [ "$UPSTREAM_SHA" = "$LAST_SHA" ]; then
            echo "Upstream unchanged since last sync — skipping heavy steps."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: ${{ steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        run: npm ci

      - name: Install Playwright Chromium (for Cloudflare pass-through)
        if: ${{ steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        run: npx playwright install --with-deps chromium

      - name: Sync data from Yawn-Sean/Daily_CF_Problems
        if: ${{ steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          CF_STATEMENTS=0 TRANSLATE=0 node scripts/update-data.mjs

      # Daily incremental statements: cover the newest uncovered problems.
      # Runs headful Chrome under Xvfb (passes Cloudflare far better than
      # headless); failures are non-fatal — affected problems degrade to
      # hint + link until a later run succeeds. Problems already on disk
      # are skipped, so only never-fetched statements consume the budget.
      - name: Fetch statements for newest problems
        if: ${{ steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        run: xvfb-run -a node scripts/fetch-statements.mjs --limit 4 --delay 6000
        env:
          CF_START_MODE: chrome-headful

      # Statements are no longer translated in CI: the free MT channels
      # rate-limit/bock datacenter runner IPs almost completely. The site
      # translates client-side instead — each visitor's browser requests the
      # missing (paragraph, channel) pairs itself (lib/zh-store.js) and
      # caches the results locally.
      - name: Re-attach statements to daily data
        if: ${{ steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          CF_STATEMENTS=0 TRANSLATE=0 node scripts/update-data.mjs

      # Persist the upstream HEAD we just synced so later polls can no-op.
      - name: Record synced upstream SHA
        if: ${{ steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -n "${{ steps.upstream.outputs.sha }}" ]; then
            echo "${{ steps.upstream.outputs.sha }}" > data/.upstream-sha
          fi

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: sync daily problems data"
            git push
          fi
