name: Update daily problems data

on:
  schedule:
    # Daily at 13:20 UTC (≈ 21:20 北京时间), after upstream posts the day's problems
    - cron: "20 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (for Cloudflare pass-through)
        run: npx playwright install --with-deps chromium

      - name: Sync data from Yawn-Sean/Daily_CF_Problems
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          CF_STATEMENTS=0 node scripts/update-data.mjs

      # Daily incremental statements: cover the newest uncovered problems.
      # Failures (e.g. Cloudflare escalation on CI IPs) are non-fatal —
      # the affected problems degrade to hint + link until a later run succeeds.
      - name: Fetch statements for newest problems
        run: node scripts/fetch-statements.mjs --limit 4 --delay 6000

      - name: Re-attach statements to daily data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          CF_STATEMENTS=0 node scripts/update-data.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: sync daily problems data"
            git push
          fi
